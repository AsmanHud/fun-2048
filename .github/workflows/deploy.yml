name: Deploy to itch.io

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Refusing to deploy: triggered on '${{ github.ref }}', not 'refs/heads/main'." >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: yeslayla/setup-butler-action@v1
      - run: butler push dist asmanhud/fun-2048:web
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
